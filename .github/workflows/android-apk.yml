# Android APK Build
# Builds the Android debug APK on every push to main and publishes it as a GitHub Release asset.
#
# The APK is built from the android-test/ module which packages:
# - The server bundle (dist-server/)
# - The web UI (dist/)
# - The testing engine and skills
# - Optional Linux rootfs for Local VM (proot + Alpine + XFCE)
#
# The version follows the scheme: 0.PR_NUMBER.COMMIT_NUMBER
# PR_NUMBER = latest merged PR number from git history
# COMMIT_NUMBER = commits since that PR merge

name: Android APK

on:
  push:
    branches:
      - main
    paths:
      # Only trigger on changes that affect the Android build
      - 'android-test/**'
      - 'scripts/build-android-apk.mjs'
      - 'scripts/prepare-android-assets.mjs'
      - 'scripts/prepare-android-tools.mjs'
      - 'scripts/prepare-browser.mjs'
      - 'scripts/bundle-server.mjs'
      - 'scripts/build-offline-rootfs.py'
      - 'src/**'
      - 'server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'tsconfig*.json'
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to build (defaults to the branch this runs from)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.1.12297006

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            python3 \
            python3-pip \
            python3-venv \
            wget \
            unzip

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web UI and server
        run: pnpm build

      - name: Bundle server
        run: pnpm build:server

      - name: Build Android APK
        run: pnpm build:android
        env:
          # Brand the APK as SpokyBot (as used in prepare-android-assets.mjs)
          OMB_TEST_BRAND: SpokyBot

      - name: Verify APK exists
        id: verify
        run: |
          APK_PATH="android-test/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            exit 1
          fi
          echo "APK found at $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          # Get APK size
          SIZE=$(stat -c%s "$APK_PATH")
          echo "APK size: $((SIZE / 1024 / 1024)) MB"

      - name: Get version info
        id: version
        run: |
          # Extract version from package.json
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SpokyBot Android ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.verify.outputs.apk_path }}